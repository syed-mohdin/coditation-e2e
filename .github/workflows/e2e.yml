name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run (leave blank for all)'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            npx playwright test --project="${{ github.event.inputs.project }}"
          else
            npx playwright test
          fi
        env:
          CI: 'true'
          HRMS_BASE_URL: ${{ secrets.HRMS_BASE_URL }}
          HRMS_USERNAME: ${{ secrets.HRMS_USERNAME }}
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
